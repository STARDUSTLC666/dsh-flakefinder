# dsh-flakefinder 组合包补丁：把测试稳定性插件行插入 profile。
# 用户 profile 的 cordis.patch.yml 可按 id 覆盖本行整个 config。
#
# 示例：
#   - id: flakefinder
#     name: 'dsh-flakefinder'
#     config:
#       defaultRuns: 5            # flaky_detect 默认重复次数（3-20）
#       maxRuns: 20               # 单次运行允许的最大重复次数（3-50）
#       defaultConcurrency: 1     # flaky_detect 默认并发 worker 数（1-4）
#       noCoverage: true          # 默认关闭覆盖率采集以加速复跑（Vitest/Jest 生效）
#       staleQuarantineDays: 14   # 隔离清单条目超期未复查提醒天数（1-365）
#       timeoutMs: 120000         # 单次测试运行超时（毫秒）
#       graceMs: 10000            # 超时或取消后等待测试进程优雅退出的宽限时间（毫秒，1 秒 - 2 分钟）
#       writeApproval: true       # quarantine/clear 是否走审批门（默认 true）
#       dataDir: ''               # 历史存储目录（默认 DSH_HOME/.dsh-flakefinder）
#       quarantineFile: ''        # 隔离清单（默认工作区根 .flakefinder.json）
#       pythonPath: ''            # pytest 使用的 Python 解释器（默认自动探测 .venv / python/python3）
#
- insert:
    - id: flakefinder
      name: 'dsh-flakefinder'
      config:
        defaultRuns: 5
        writeApproval: true
